<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">  
</head>
<body>
    <div id="form">

        <form action="">
            <h1>Registration Form</h1>
            <p>Fill out the form carefully</p>
            <div class="student_name">
                <label for="" class="label_name">Student Name</label>
            </div>
           
            <br>
            <div class="full_name">
                <div class="name">
                    <input type="text" required class="w1">
                    <p>First name</p>
                </div>

                <div class="name">
                    <input type=" text" required class="w1">
                    <p>Middle name</p>
                </div>
                <div class="name">
                    <input type=" text" required class="w1">
                    <p>Last name</p>
                </div>
            </div>
            <br>
            <div class="Birth_date">
                <label for="" class="label_name ">Birth Date</label>
            </div>
            
            <br>
            <input type="date" name="" id="" required class="w1">
            <br>
            <div class="GenderandDegree">
                <label for="" id="gender" class="label_name">Gender</label>
                <br>
                <label for="male" class="label_name">Male</label>
                <input type="radio" id="male" name="gender" required>
                <label for="female" class="label_name">Female</label>
                <input type="radio" id="female" name="gender" required>
            </div>

            <br>
            <div class="address">
                <label for="" class="label_name">Address</label>
            </div>
            
            <br>
            <div id="street_address">
                <input type="text" name="" id="" placeholder="Street Address" required class="w1">
                <input type="text" placeholder="Street Address Line2" class="w1">
            </div>

            <br>
            <div id="city">
                <input type="text" name="" id="" placeholder="City" class="w1" required>
                <input type="text" placeholder="Region" class="w1">
            </div>

            <br>
            <div class="country">
                <label for="" class="label_name">Country</label>
            </div>
            

            <select name="" id="" class="w1 country_select">
                <option>Please select a country</option>
                <option>Afghanistan</option>

                <option>Albania</option>
                <option>Algeria</option>
                <option>Andorra</option>
                <option>Bahamas</option>
                <option>Bahrain</option>
                <option>Bangladesh</option>
                <option>Barbados</option>
                <option>Cambodia</option>
                <option> Cameroon</option>
                <option>Canada</option>Canada
            </select>
            <br>
            <div class="emandph">
                <div class="email">
                    
                        <label for="" class="label_name">Email</label>
                
                    
                <input type="email" name="" class="EmailandPhone w1 mg" required placeholder="example@email.com">
                </div>
                
                <div class="phone">
                    <label for="" class="label_name ">Phone number</label>
                <input type="number" name="" class="EmailandPhone w1 phone_input" placeholder="01771243568" required>
                </div>
            </div>
            

            <br>
            <div class="GenderandDegree1">
                <div class="Degree">
                    
                    <br>
                    <div>
                        <label for="" class="label_name ">
                            Degree level:
                        </label>
                        <label for="Undergraduate" class="label_name">Undergraduate</label>
                    <input type="radio" name="Degree" id="Undergraduate" required>
                    <label for="Postgraduate" class="label_name">Postgraduate</label>
                    <input type="radio" name="Degree" id="Postgraduate">
                    </div>

                </div>
                
<div class="student_image">
    <label for="" class="label_name">Student image:</label>
    <div id="image_holder">
        <input type="file" name="" id="">
        <p>.JPEG/.PNG/.GIF</p>
    </div>
</div>
                
               
            </div>
            <br>
            <div class="DepartmentandExtra">

                <div class="deptandambience">
                    
                        <label for="" class="label_name dept">Department</label>
                    <select name="" id="department" class="w1 ">
                        <option value="">CSE</option>
                        <option value="">CS</option>
                        <option value="">EEE</option>
                    </select>
                    
                    
                    <div>
                        <label for="tempB" class="label_name">Ambience Of The University</label><br />
                        <input type="range" id="tempB" name="temp" list="values" required />

                        <datalist id="values">

                            <option value="0" label="Worse"></option>
                            <option value="25" label="Not Bad"></option>
                            <option value="50" label="Medium"></option>
                            <option value="75" label="Good"></option>
                            <option value="100" label="Very Good"></option>
                        </datalist>
                    </div>

                </div>

                <div class="extra_curricular">
                    <label for="" class="label_name">Extra Curricular Activities</label>
                    <br>
                    <div class="activities">
                        <label for="">Sports</label>
                        <input type="checkbox" name="" id="">
                        <br>
                        <label for="">Debate club</label>
                        <input type="checkbox" name="" id="">
                        <br>
                        <label for="">Volunteering</label>
                        <input type="checkbox" name="" id="">
                        <br>
                        <label for="">Art club</label>
                        <input type="checkbox" name="" id="">
                        <br>
                        <label for="">Law firm internship</label>
                        <input type="checkbox" name="" id="">
                        <br>
                        <label for="">Community theater</label>
                        <input type="checkbox" name="" id="">
                    </div>
                </div>
            </div>
            <br>
            <br>
            <div class="button_part">
                <button type="submit" id="submit" name="gender" class="button">Submit</button>
                <button type="reset" class="button">Reset</button>
            </div>


        </form>
    </div>
</body>

</html>
